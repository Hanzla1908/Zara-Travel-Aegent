<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard — Cozy Corner Cafe</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0e8df;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: #3d1f1a;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header h1  { font-size: 16px; font-weight: 700; }
    .header p   { font-size: 12px; opacity: .6; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    #last-updated { font-size: 12px; opacity: .6; white-space: nowrap; }

    #refresh-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      border-radius: 6px;
      padding: 6px 13px;
      font-size: 13px;
      cursor: pointer;
    }
    #refresh-btn:hover { background: rgba(255,255,255,.25); }

    /* ── Main ── */
    .main {
      max-width: 980px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    .empty-state {
      text-align: center;
      color: #9a8880;
      padding: 72px 20px;
      font-size: 15px;
    }

    .orders-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    /* ── Card ── */
    .order-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(61,31,26,.09);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .card-head {
      padding: 12px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      border-bottom: 1px solid #f5ede6;
    }
    .order-id   { font-size: 13px; font-weight: 700; color: #2d1810; font-family: monospace; }
    .order-time { font-size: 11px; color: #b0a098; margin-top: 3px; }

    .badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-confirmed { background: #dbeafe; color: #1d4ed8; }
    .badge-preparing { background: #fef3c7; color: #92400e; }
    .badge-ready     { background: #d1fae5; color: #065f46; }
    .badge-completed { background: #f3f4f6; color: #6b7280; }
    .badge-cancelled { background: #fee2e2; color: #991b1b; }

    .card-section {
      padding: 10px 16px;
      border-bottom: 1px solid #f5ede6;
    }
    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: #c8a07a;
      margin-bottom: 6px;
    }

    /* Items */
    .item-line { font-size: 13px; color: #2d1810; padding: 2px 0; line-height: 1.45; }
    .item-note { font-size: 12px; color: #9a8880; padding-left: 14px; padding-bottom: 2px; }

    /* Fulfillment */
    .info-row   { font-size: 13px; color: #2d1810; padding: 2px 0; }
    .info-label { font-size: 12px; color: #9a8880; margin-right: 4px; }

    /* Pricing */
    .price-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #5a4a44;
      padding: 1px 0;
    }
    .price-row.total {
      font-weight: 700;
      font-size: 14px;
      color: #2d1810;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid #f0e8df;
    }

    /* Actions */
    .card-actions {
      padding: 10px 16px 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
    }
    .btn {
      flex: 1;
      min-width: 90px;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: #3d1f1a; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #5a2e28; }
    .btn-danger  { background: #fee2e2; color: #991b1b; }
    .btn-danger:hover:not(:disabled)  { background: #fecaca; }

    @media (max-width: 460px) {
      .orders-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="header">
  <div>
    <h1>☕ Staff Dashboard</h1>
    <p>Cozy Corner Cafe</p>
  </div>
  <div class="header-right">
    <span id="last-updated"></span>
    <button id="refresh-btn" type="button" onclick="loadOrders()">↻ Refresh</button>
  </div>
</header>

<main class="main">
  <div id="orders-container"></div>
</main>

<script>
  const NEXT_ACTIONS = {
    confirmed: [
      { label: 'Start Preparing', status: 'preparing', primary: true  },
      { label: 'Cancel',          status: 'cancelled', primary: false },
    ],
    preparing: [
      { label: 'Mark Ready', status: 'ready',     primary: true  },
      { label: 'Cancel',     status: 'cancelled', primary: false },
    ],
    ready: [
      { label: 'Complete', status: 'completed', primary: true },
    ],
  };

  const STATUS_LABEL = {
    confirmed: 'Confirmed', preparing: 'Preparing',
    ready: 'Ready', completed: 'Completed', cancelled: 'Cancelled',
  };

  function esc(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
         + ' · ' + d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  function buildCard(o) {
    const card = document.createElement('div');
    card.className = 'order-card';
    card.id = 'card-' + o.order_id;

    // ── Head
    card.innerHTML =
      `<div class="card-head">
        <div>
          <div class="order-id">${esc(o.order_id)}</div>
          <div class="order-time">${fmtTime(o.confirmed_at)}</div>
        </div>
        <span class="badge badge-${esc(o.status)}">${esc(STATUS_LABEL[o.status] || o.status)}</span>
      </div>`;

    // ── Items
    const itemsSec = document.createElement('div');
    itemsSec.className = 'card-section';
    itemsSec.innerHTML = '<div class="section-label">Items</div>';
    (o.items || []).forEach(it => {
      const size  = it.size       ? ` (${esc(it.size)})` : '';
      const price = it.line_total != null ? ` — $${it.line_total.toFixed(2)}` : '';
      itemsSec.innerHTML += `<div class="item-line">${it.quantity}× ${esc(it.name)}${size}${price}</div>`;
      if (it.notes) itemsSec.innerHTML += `<div class="item-note">${esc(it.notes)}</div>`;
    });
    card.appendChild(itemsSec);

    // ── Fulfillment
    const fulfSec = document.createElement('div');
    fulfSec.className = 'card-section';
    fulfSec.innerHTML = '<div class="section-label">Fulfillment</div>';
    const typeLabel = (o.order_type || '—').replace('_', '-');
    fulfSec.innerHTML += `<div class="info-row"><span class="info-label">Type</span>${esc(typeLabel)}</div>`;
    if (o.customer?.name)
      fulfSec.innerHTML += `<div class="info-row"><span class="info-label">Name</span>${esc(o.customer.name)}</div>`;
    if (o.pickup_time)
      fulfSec.innerHTML += `<div class="info-row"><span class="info-label">Pickup</span>${esc(o.pickup_time)}</div>`;
    if (o.order_type === 'delivery' && o.delivery) {
      const d = o.delivery;
      if (d.phone)
        fulfSec.innerHTML += `<div class="info-row"><span class="info-label">Phone</span>${esc(d.phone)}</div>`;
      if (d.address) {
        const addr = d.unit ? `${esc(d.address)}, ${esc(d.unit)}` : esc(d.address);
        fulfSec.innerHTML += `<div class="info-row"><span class="info-label">Address</span>${addr}</div>`;
      }
      if (d.instructions)
        fulfSec.innerHTML += `<div class="info-row"><span class="info-label">Note</span>${esc(d.instructions)}</div>`;
    }
    card.appendChild(fulfSec);

    // ── Pricing
    const priceSec = document.createElement('div');
    priceSec.className = 'card-section';
    priceSec.innerHTML = '<div class="section-label">Pricing</div>';
    if (o.discount)      priceSec.innerHTML += row('Subtotal', `$${(o.subtotal || 0).toFixed(2)}`);
    if (o.discount)      priceSec.innerHTML += row('Discount', `−$${o.discount.toFixed(2)}`);
    if (o.delivery_fee)  priceSec.innerHTML += row('Delivery fee', `$${o.delivery_fee.toFixed(2)}`);
    if (o.tax)           priceSec.innerHTML += row('Tax', `$${o.tax.toFixed(2)}`);
    priceSec.innerHTML += row('Total', `$${(o.total || 0).toFixed(2)}`, true);
    card.appendChild(priceSec);

    // ── Actions
    const actions = NEXT_ACTIONS[o.status] || [];
    if (actions.length) {
      const actSec = document.createElement('div');
      actSec.className = 'card-actions';
      actions.forEach(a => {
        const btn = document.createElement('button');
        btn.type      = 'button';
        btn.className = 'btn ' + (a.primary ? 'btn-primary' : 'btn-danger');
        btn.textContent = a.label;
        btn.onclick = () => doStatusUpdate(o.order_id, a.status, card);
        actSec.appendChild(btn);
      });
      card.appendChild(actSec);
    }

    return card;
  }

  function row(label, value, total = false) {
    return `<div class="price-row${total ? ' total' : ''}"><span>${label}</span><span>${value}</span></div>`;
  }

  async function doStatusUpdate(orderId, newStatus, card) {
    card.querySelectorAll('.btn').forEach(b => b.disabled = true);
    try {
      const res = await fetch(`/api/orders/${encodeURIComponent(orderId)}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus }),
      });
      if (res.ok) {
        card.replaceWith(buildCard(await res.json()));
      } else {
        card.querySelectorAll('.btn').forEach(b => b.disabled = false);
      }
    } catch {
      card.querySelectorAll('.btn').forEach(b => b.disabled = false);
    }
  }

  async function loadOrders() {
    const container = document.getElementById('orders-container');
    try {
      const res  = await fetch('/api/orders');
      const list = await res.json();
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (!Array.isArray(list) || !list.length) {
        container.innerHTML = '<div class="empty-state">No orders yet.</div>';
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'orders-grid';
      list.forEach(o => grid.appendChild(buildCard(o)));
      container.innerHTML = '';
      container.appendChild(grid);
    } catch {
      container.innerHTML = '<div class="empty-state">Could not load orders — is the server running?</div>';
    }
  }

  loadOrders();
  setInterval(loadOrders, 30_000);
</script>
</body>
</html>
